services:
  - type: web
    name: yinuo-agent
    runtime: node
    plan: starter
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    envVars:
      - key: LLM_PROVIDER
        value: gemini
      - key: GEMINI_MODEL
        value: gemini-3.1-pro-preview
      - key: YINUO_WEB_USERNAME
        sync: false
      - key: YINUO_WEB_PASSWORD
        sync: false
      - key: GEMINI_API_KEY
        sync: false
